spring.application.name=MeuBolso
server.port=8080
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/meubolso}
app.jwt.secret=${APP_JWT_SECRET:desenvolvimento-local-segredo-com-mais-de-32-caracteres}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# Chatbot do WhatsApp via WAHA (container local pareado a um número).
# URL da API do WAHA e nome da sessão criada nele.
app.waha.api-url=${WAHA_API_URL:http://localhost:3000}
app.waha.session=${WAHA_SESSION:default}
# Mesma chave passada ao container (WAHA_API_KEY); enviada no header X-Api-Key.
app.waha.api-key=${WAHA_API_KEY:}
# Proteções para testar o bot num número PESSOAL (padrão seguro):
# - sem conversa em andamento, só responde mensagens com a palavra de ativação
#   (ignora maiúsculas, acentos e espaços). Vazio = qualquer mensagem chama o bot;
# - números sem conta no Meu Bolso não recebem resposta.
# Com um número dedicado ao bot: WHATSAPP_PALAVRA_ATIVACAO= (vazio) e
# WHATSAPP_RESPONDER_NAO_CADASTRADOS=true.
app.whatsapp.palavra-ativacao=${WHATSAPP_PALAVRA_ATIVACAO:meu bolso}
app.whatsapp.responder-nao-cadastrados=${WHATSAPP_RESPONDER_NAO_CADASTRADOS:false}
spring.data.mongodb.auto-index-creation=true
server.error.include-stacktrace=never

# Configurações do servidor de e-mail
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

# Mostra a mensagem dos erros (ex.: "Este e-mail já está cadastrado.") para o front-end
server.error.include-message=always

app.mail.from=${MAIL_FROM:no-reply@meubolso.local}
app.recovery.token-minutes=${RECOVERY_TOKEN_MINUTES:30}
