services:
  mongodb:
    image: mongo:latest
    container_name: meubolso-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: meubolso
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meubolso-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/meubolso
      API_SECURITY_TOKEN_SECRET: minhaChaveSecretaSuperSeguraParaMeuBolso2026!
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
