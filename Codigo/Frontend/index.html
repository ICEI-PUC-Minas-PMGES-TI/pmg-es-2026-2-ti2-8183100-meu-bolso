<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/Logo_meu_bolso_clean.png" />
    <link rel="apple-touch-icon" href="/images/Logo_meu_bolso_clean.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Meu Bolso — controle financeiro pessoal: gastos, receitas, metas e carteiras."
    />
    <title>Meu Bolso</title>
    <!-- Aplica o tema salvo antes da página pintar (evita piscar no claro).
         A chave é a mesma de src/hooks/useTema.js. -->
    <script>
      try {
        if (localStorage.getItem("meubolso-tema") === "escuro") {
          document.documentElement.dataset.tema = "escuro";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
